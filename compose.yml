services:
  proxy:
    image: nginx:stable
    container_name: meetonline-proxy
    depends_on:
      - client
      - server
    ports:
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
      - client_certs:/client/.cert
      - client_dist:/usr/share/nginx/html:ro
      - server_certs:/server/certs
    restart: no

  client:
    build:
      context: ./client/react-client-app
      dockerfile: Dockerfile
    image: meetonline-client:latest
    container_name: meetonline-client
    env_file:
      - ./client/react-client-app/docker.env
    depends_on:
      - server
    volumes:
      - client_dist:/dist
    restart: no

  server:
    build:
      context: ./server/node-server-app
      dockerfile: Dockerfile
    image: meetonline-server:latest
    container_name: meetonline-server
    env_file:
      - ./server/node-server-app/docker.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - server_uploads:/server/uploads
      - server_certs:/server/certs
      - server_tmp:/server/tmp
    restart: no

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: meetonline-database:latest
    container_name: meetonline-database
    env_file:
      - ./database/docker.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql:Z
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  server_uploads:
  server_certs:
  server_tmp:
  client_certs:
  client_dist:
