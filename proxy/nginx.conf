user nginx;
worker_processes auto;

events { worker_connections 4096; }

http {

    include /etc/nginx/mime.types;
    sendfile on;

    # server {
    #     listen 80;
    #     server_name meet.online;
    #     return 301 https://meet.online$request_uri;
    # }

    server {
        listen 443 ssl;
        server_name meet.online;
        client_max_body_size 60M;

        # ssl_certificate_cache off;
        ssl_certificate_cache max=1000 inactive=20s valid=1m;

        ssl_certificate /server/certs/server.crt;
        ssl_certificate_key /server/certs/server.key;

        # ssl_client_certificate /grahak/.cert/cert.pem;
        # ssl_client_certificate_key /grahak/.cert/key.pem;
        ssl_verify_client off;

        # Serve built React frontend
        root /usr/share/nginx/html;
        index index.html;

        # Forward API calls to backend container
        location /api/ {
            proxy_pass https://server:9443/;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback (React Router)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
