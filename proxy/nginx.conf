server {
    listen 443;
    server_name localhost;

    # Proxy main requests to Vite dev server
    location / {
        proxy_pass https://client:5173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Allow websocket for HMR
    location /@vite {
        proxy_pass https://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # HMR WebSocket
    location /vite/ {
        proxy_pass https://client:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
